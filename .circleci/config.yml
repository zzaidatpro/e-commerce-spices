version: 2.1

executors:
  node-docker:
    docker:
      - image: cimg/node:20.11-browsers
    working_directory: ~/repo
  machine-docker:
    machine:
      image: ubuntu-2204:current
    working_directory: ~/repo

jobs:
  quality:
    executor: node-docker
    steps:
      - checkout
      - run:
          name: Installer pnpm
          command: sudo npm install -g pnpm@12.8.1
      - restore_cache:
          keys:
            - v3-deps-{{ checksum "pnpm-lock.yaml" }}
            - v3-deps-
      - run:
          name: Installer les dépendances
          command: pnpm install --frozen-lockfile
      - save_cache:
          paths:
            - ~/.local/share/pnpm/store
          key: v3-deps-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Vérification des types
          command: pnpm typecheck
      - run:
          name: Lint
          command: pnpm lint
      - run:
          name: Tests unitaires
          command: pnpm test:unit
      - run:
          name: Build web
          command: pnpm --filter web build
          environment:
            NEXT_PUBLIC_SUPABASE_URL: $NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY: $NEXT_PUBLIC_SUPABASE_ANON_KEY

  e2e:
    executor: machine-docker
    steps:
      - checkout
      - run:
          name: Installer pnpm
          command: |
            npm install -g pnpm@12.8.1
            pnpm install --frozen-lockfile
      - run:
          name: Démarrer Supabase local
          command: |
            pnpm exec supabase start
            pnpm exec supabase db reset
      - run:
          name: Écrire .env.test pour la base locale
          command: bash scripts/ci-env.sh
      - run:
          name: Installer Chromium
          command: pnpm exec playwright install --with-deps chromium
      - run:
          name: Tests e2e
          command: pnpm exec playwright test
      - store_artifacts:
          path: test-results
          destination: test-results
      - store_artifacts:
          path: playwright-report
          destination: playwright-report

workflows:
  quality-check:
    jobs:
      - quality
      - e2e:
          requires: [quality]