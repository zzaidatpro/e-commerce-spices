version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:24.18.0
    working_directory: ~/repo
    environment:
      PNPM_HOME: /home/circleci/.local/share/pnpm
      COREPACK_ENABLE_STRICT: "0"
      CI: "true"

jobs:
  quality:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Activer pnpm 12.8.1
          command: |
            corepack enable
            corepack prepare pnpm@12.8.1 --activate
            echo 'export PATH="$PNPM_HOME:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
      - restore_cache:
          keys:
            - v3-deps-{{ checksum "pnpm-lock.yaml" }}
            - v3-deps-
      - run:
          name: Installer les dépendances
          command: pnpm install --frozen-lockfile
      - save_cache:
          paths:
            - ~/.local/share/pnpm/store
          key: v3-deps-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Type check
          command: pnpm typecheck
      - run:
          name: Lint
          command: pnpm lint
      - run:
          name: Unit tests
          command: pnpm test:unit
      - run:
          name: Build web et admin
          command: pnpm --filter ./apps/web --filter ./apps/admin build
          environment:
            NEXT_PUBLIC_SUPABASE_URL: $NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY: $NEXT_PUBLIC_SUPABASE_ANON_KEY

  e2e:
    executor: node-executor
    steps:
      - run:
          name: E2E pas encore activés
          command: echo "Les tests e2e seront branchés après la mise en place de Supabase local en CI."

workflows:
  quality-check:
    jobs:
      - quality
      - e2e:
          requires: [quality]