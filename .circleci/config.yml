version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:20.11
    working_directory: ~/repo

jobs:
  quality:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: npm install -g pnpm@9
      - restore_cache:
          keys:
            - v2-deps-{{ checksum "pnpm-lock.yaml" }}
            - v2-deps-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          paths:
            - ~/.local/share/pnpm/store
          key: v2-deps-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Type check
          command: pnpm typecheck
      - run:
          name: Lint
          command: pnpm lint
      - run:
          name: Unit tests
          command: pnpm test:unit
      - run:
          name: Build web
          command: pnpm --filter web build
          environment:
            NEXT_PUBLIC_SUPABASE_URL: $NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY: $NEXT_PUBLIC_SUPABASE_ANON_KEY

  e2e:
    executor: node-executor
    steps:
      - run:
          name: E2E pas encore activés
          command: echo "Les tests e2e seront branchés après la mise en place de Supabase local en CI."

workflows:
  quality-check:
    jobs:
      - quality
      - e2e:
          requires: [quality]