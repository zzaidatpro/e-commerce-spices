version: 2.1

executors:
  node-docker:
    docker:
      - image: cimg/node:20.11-browsers
    working_directory: ~/repo
  machine-docker:
    machine:
      image: ubuntu-2204:current
    working_directory: ~/repo

jobs:
  quality:
    executor: node-docker
    steps:
      - checkout
      - run: npm install -g pnpm@9
      - restore_cache:
          keys:
            - v3-deps-{{ checksum "pnpm-lock.yaml" }}
            - v3-deps-
      - run: pnpm install --frozen-lockfile
      - save_cache:
          paths:
            - ~/.local/share/pnpm/store
          key: v3-deps-{{ checksum "pnpm-lock.yaml" }}
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run:
          name: Build web
          command: pnpm --filter web build
          environment:
            NEXT_PUBLIC_SUPABASE_URL: $NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY: $NEXT_PUBLIC_SUPABASE_ANON_KEY

  e2e:
    executor: machine-docker
    steps:
      - checkout
      - run:
          name: Installer pnpm et la CLI Supabase
          command: |
            npm install -g pnpm@9
            pnpm install --frozen-lockfile
            pnpm add -D -w supabase
      - run:
          name: Démarrer Supabase local
          command: |
            pnpm exec supabase start
            pnpm exec supabase db reset
      - run:
          name: Écrire .env.test depuis la base locale
          command: |
            cat > apps/admin/.env.test <<EOF
            SUPABASE_URL=http://127.0.0.1:54321
            SUPABASE_ANON_KEY=$(pnpm exec supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
            SUPABASE_SERVICE_ROLE_KEY=$(pnpm exec supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')
            NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
            NEXT_PUBLIC_SUPABASE_ANON_KEY=$(pnpm exec supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
            EOF
      - run:
          name: Installer Chromium
          command: pnpm exec playwright install --with-deps chromium
      - run:
          name: Tests e2e
          command: pnpm exec playwright test
      - store_artifacts:
          path: test-results
          destination: test-results
      - store_artifacts:
          path: playwright-report
          destination: playwright-report

workflows:
  quality-check:
    jobs:
      - quality
      - e2e:
          requires: [quality]