version: 2.1

executors:
  node-executor:
    docker:
      - image: mcr.microsoft.com/playwright:v1.40.0-jammy
    working_directory: ~/repo

jobs:
  test-e2e:
    executor: node-executor
    steps:
      - checkout

      # Installation globale de pnpm pour éviter les erreurs Corepack
      - run:
          name: Install pnpm globally
          command: npm install -g pnpm

      # Restauration du cache pnpm
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pnpm-lock.yaml" }}
            - v1-dependencies-

      # Installation des dépendances
      - run:
          name: Install Dependencies
          command: pnpm install --frozen-lockfile

      # Sauvegarde du cache pnpm
      - save_cache:
          paths:
            - ~/.local/share/pnpm/store
          key: v1-dependencies-{{ checksum "pnpm-lock.yaml" }}

      # Vérification du typage TypeScript via Turborepo
      - run:
          name: Type Check
          command: pnpm typecheck

      # Exécution du linter via Turborepo
      - run:
          name: Lint
          command: pnpm lint

      # Build de l'application apps/web
      - run:
          name: Build Web App
          command: pnpm --filter web build
          environment:
            NEXT_SUPABASE_URL: $NEXT_SUPABASE_URL
            NEXT_SUPABASE_ANON_KEY: $NEXT_SUPABASE_ANON_KEY

      # Exécution des tests E2E Playwright sur apps/web
      - run:
          name: Run Playwright E2E Tests
          command: pnpm --filter web test:e2e
          environment:
            NEXT_SUPABASE_URL: $NEXT_SUPABASE_URL
            NEXT_SUPABASE_ANON_KEY: $NEXT_SUPABASE_ANON_KEY

      # Sauvegarde des rapports Playwright en cas d'échec
      - store_artifacts:
          path: apps/web/playwright-report
          destination: playwright-report

workflows:
  quality-check:
    jobs:
      - test-e2e
